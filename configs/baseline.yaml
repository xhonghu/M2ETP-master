feeder: dataloader_video.BaseFeeder
phase: train
dataset: phoenix2014-T
# phoenix2014-T
# CSL-Daily
# phoenix2014

work_dir: ./work_dirt/
batch_size: 4
random_seed: 0 
test_batch_size: 4
num_worker: 10
device: 0
log_interval: 10000
eval_interval: 1
save_interval: 10
 
loss_weights:
  SeqCTC: 1.0 
  ConvCTC: 1.0
  Dist: 25.0

load_weights:  False
load_checkpoints:  False
optimizer_args:
  optimizer: Adam
  learning_rate:
    base_lr: 2.0e-04
  step: [25,40]
  learning_ratio: 1
  scheduler: ScheaL   #ScheaL #consine
  gamma: 0.2
  eta_min: 1.0e-06
  weight_decay: 0.0001
  start_epoch: 0
  num_epoch: 60 #30 #60
  nesterov: False

feeder_args:
  mode: 'train'
  drop_ratio: 1.0
  frame_interval: 1
  image_scale: 1.0  # 0-1 represents ratio, >1 represents absolute value
  input_size: 224

model: slr_network.SLRModel
slowfast_config: SLOWFAST_64x2_R101_50_50.yaml
decode_mode: beam
model_args:
  c2d_type: slowfast101
  conv_type: 2
  use_bn: 1 
  share_classifier: True
  weight_norm: True
